<mat-list-item class="relative rounded-xl!" [class.bg-error/10!]="value.pending">
	<span matListItemTitle>
		{{ value.username }}
	</span>
	<a class="link" [href]="'mailto:' + value.email" matListItemLine>
		{{ value.email }}
	</a>
	<span matListItemLine>
		Created on {{ value.creationDate | date:'medium' }}
	</span>
	@if (hovering) {
	<div matListItemMeta>
		<button mat-icon-button [disabled]="value.pending" (click)="detail.next(value._id)">
			<mat-icon>info</mat-icon>
		</button>
		<button mat-icon-button class="lv-accent" [disabled]="value.pending" (click)="edit.next(value)">
			<mat-icon>edit</mat-icon>
		</button>
		<button mat-icon-button class="lv-error" [disabled]="value.pending" (click)="delete.next(value)">
			<mat-icon>delete</mat-icon>
		</button>
	</div>
	}
	@if (value.pending) {
	<lv-loading-placeholder class="absolute-center lv-error" [diameter]="48"></lv-loading-placeholder>
	}
</mat-list-item>
