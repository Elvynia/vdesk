<mat-card class="grow">
	<mat-card-header class="mb-4">
		<h1 mat-card-title>{{ value?._id ? 'Edit' : 'New' }} companyType</h1>
	</mat-card-header>
	<mat-card-content class="flex! grow flex-col">
		<lv-company-type-form
			[value]="value"
			[group]="group"
			*lvLoading="pending; d: 128; c: ['lv-accent', 'py-4']"
		></lv-company-type-form>
	</mat-card-content>
	<mat-card-actions class="duo">
		<button
			mat-stroked-button
			class="lv-error"
			[disabled]="pending"
			(click)="cancel()"
		>
			Cancel
		</button>
		<button
			mat-raised-button
			class="lv-accent"
			[disabled]="pending || group.invalid || group.pending"
			(click)="submit()"
		>
			Submit
		</button>
	</mat-card-actions>
</mat-card>
